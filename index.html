<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RoomSketch Lite</title>
<style>
:root{--bg:#faf6f0;--pn:#fffdf9;--bd:#e6dfd3;--tx:#38353a;--mu:#8a8490;--ac:#7fa086;--ac2:#b9a9d9;--sh:0 4px 16px rgba(80,70,50,.09);--r:14px;--floor:#fbf8f2;--grid:#e4ddcf;--wall:#8a8294;--line:#6b6470;--warn:#e0735f;--cvbg:#efe9df;--win:#d8ebf5}

*{box-sizing:border-box}
body{margin:0;height:100vh;font:14px/1.4 ui-rounded,"SF Pro Rounded",Nunito,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--tx);transition:background .3s,color .3s;overflow:hidden}
#app{display:flex;flex-direction:column;height:100vh}
header{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--pn);border-bottom:1px solid var(--bd);flex-wrap:wrap;transition:background .3s}
.logo{font-weight:800;letter-spacing:-.3px;display:flex;align-items:center;gap:7px}
.logo i{width:26px;height:26px;border-radius:9px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:inline-block}
.sp{flex:1}
.btn{border:1px solid var(--bd);background:var(--pn);color:var(--tx);border-radius:10px;padding:6px 10px;min-height:34px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;font:inherit;transition:.15s}
.btn:hover{transform:translateY(-1px);box-shadow:var(--sh)}
.btn.pri{background:var(--ac);color:#fff;border-color:transparent}
.btn.on{background:var(--ac2);color:#2a2540;border-color:transparent}
.btn.dng{color:var(--warn)}
.btn:disabled{opacity:.4;pointer-events:none}
:focus-visible{outline:2px solid var(--ac2);outline-offset:2px}
svg.ic{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
input,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:9px;padding:6px 8px;min-height:34px;min-width:0}
#pname{font-weight:700;border-color:transparent;background:transparent;width:190px}
#pname:hover,#pname:focus{border-color:var(--bd);background:var(--bg)}
#status{font-size:12px;color:var(--mu);padding:3px 9px;border-radius:99px;background:var(--bg)}
#main{flex:1;display:flex;min-height:0;position:relative}

#lib{border-right:1px solid var(--bd)}#insp{border-left:1px solid var(--bd);width:285px}
.pad{padding:10px}

.tab{border:0;background:var(--bg);color:var(--tx);border-radius:99px;padding:3px 9px;font-size:12px;cursor:pointer}.tab.on{background:var(--ac);color:#fff}

.card{display:flex;gap:10px;align-items:center;width:100%;text-align:left;margin-bottom:6px;padding:6px 8px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);cursor:pointer;transition:.15s;font:inherit}
.card:hover{transform:translateX(2px);border-color:var(--ac);box-shadow:var(--sh)}

#work{flex:1;display:flex;flex-direction:column;min-width:0}

#wrap{flex:1;position:relative;min-height:0;background:var(--cvbg)}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}

.w:hover{border-color:var(--warn)}

.ov{position:fixed;inset:0;background:rgba(30,25,40,.4);display:flex;align-items:center;justify-content:center;z-index:50;padding:14px}
.md{background:var(--pn);border-radius:20px;padding:20px;max-width:480px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.3);max-height:90vh;overflow:auto}
.md h2{margin:0 0 10px}.mf{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.pl{display:flex;align-items:center;gap:6px;padding:7px 0;border-bottom:1px solid var(--bd)}.pl div{flex:1;min-width:0}.pl small{color:var(--mu)}
#toasts{position:fixed;bottom:18px;right:18px;display:flex;flex-direction:column;gap:6px;z-index:99}
.toast{background:var(--tx);color:var(--bg);padding:9px 14px;border-radius:12px;box-shadow:var(--sh);animation:up .25s}
@keyframes up{from{transform:translateY(8px);opacity:0}}
kbd{background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:0 5px;font-size:12px}
.mob{display:none}
@media(max-width:1000px){aside{position:absolute;top:0;bottom:0;z-index:8;display:none;box-shadow:var(--sh)}#lib{left:0}#insp{right:0}aside.show{display:flex}.mob{display:inline-flex}#pname{width:130px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
#ptitle{display:none}
@media print{header,aside,#tb,#ctx,#empty,#toasts{display:none!important}#ptitle{display:block;padding:10px;font-size:18px}body,#app{height:auto;overflow:visible}#wrap{height:90vh}}
</style></head><body>

<header>
 <div class="logo"><i></i>RoomSketch Lite</div>

<div id="main">

  </div>
  <div id="ptitle"></div>

 </section>
 <aside id="insp"><div class="body"></div><details id="val" open><summary>Layout check</summary><div id="vbody"></div></details></aside>
</div></div><div id="toasts"></div>
<script>

// ---------- catalogue ----------

tall|Tall Cabinet|Storage|600|450|#d9c3a5|cab
splant|Small Plant|Decor|300|300|#a9cfa4|plant
lplant|Large Plant|Decor|700|700|#93c18f|plant

win|Window|Doors|1200|0|#fff|win`.split('\n').map(l=>{const a=l.split('|');return{k:a[0],n:a[1],c:a[2],w:+a[3],h:+a[4],col:a[5],s:a[6]}});
const DEF=Object.fromEntries(CAT.map(d=>[d.k,d])),isOp=k=>DEF[k]&&(DEF[k].c==='Doors');
const CL={All:'All',Living:'Living room',Bedroom:'Bedroom',Kitchen:'Kitchen',Bathroom:'Bathroom',Office:'Office',Storage:'Storage',Doors:'Doors & windows',Decor:'Decor'};
// ---------- state ----------
let DB={projects:{},cur:null},P=null,sel=null,cam={z:.1,x:0,y:0},S={cat:'All',q:''},V={},drag=null,H=[],hi=0,clip=null,need=true,saveT,CW=800,CH=600,persist=true;
const KEY='roomsketch.lite.v1',cv=$('#cv'),cx=cv.getContext('2d');
const get=id=>P.items.find(i=>i.id===id)||P.ops.find(i=>i.id===id);
const rad=d=>d*Math.PI/180;
// ---------- geometry ----------
function corners(it){const c=Math.cos(rad(it.rot)),s=Math.sin(rad(it.rot)),a=it.w/2,b=it.h/2;return[[-a,-b],[a,-b],[a,b],[-a,b]].map(([x,y])=>[it.x+x*c-y*s,it.y+x*s+y*c])}
function sat(A,B,tol=1){for(const poly of[A,B])for(let i=0;i<4;i++){const p=poly[i],q=poly[(i+1)%4],nx=q[1]-p[1],ny=p[0]-q[0],L=Math.hypot(nx,ny)||1;let a0=1e18,a1=-1e18,b0=1e18,b1=-1e18;for(const v of A){const d=(v[0]*nx+v[1]*ny)/L;a0=Math.min(a0,d);a1=Math.max(a1,d)}for(const v of B){const d=(v[0]*nx+v[1]*ny)/L;b0=Math.min(b0,d);b1=Math.max(b1,d)}if(Math.min(a1,b1)-Math.max(a0,b0)<=tol)return false}return true}
function oframe(o){const R=P.room,t=R.t;return o.wall==='N'?{cx:o.pos,cy:-t/2,a:0}:o.wall==='S'?{cx:o.pos,cy:R.l+t/2,a:180}:o.wall==='W'?{cx:-t/2,cy:o.pos,a:-90}:{cx:R.w+t/2,cy:o.pos,a:90}}
function loc(f,x,y){const c=Math.cos(rad(f.a)),s=Math.sin(rad(f.a));return[f.cx+x*c-y*s,f.cy+x*s+y*c]}
function zone(o){const f=oframe(o),t=P.room.t,d=o.type==='ddoor'||o.type==='door'?Math.max(P.room.clr,o.w):P.room.clr,h=o.w/2;return[loc(f,-h,t/2),loc(f,h,t/2),loc(f,h,t/2+d),loc(f,-h,t/2+d)]}
const shape=it=>(DEF[it.k]||{}).s;
function validate(){const R=P.room,its=P.items.filter(i=>i.vis!==false),cs=its.map(corners),ov=[],out=[],cl=[],bad=new Set(),badO=new Set();
 const bb=cs.map(c=>[Math.min(...c.map(p=>p[0])),Math.max(...c.map(p=>p[0])),Math.min(...c.map(p=>p[1])),Math.max(...c.map(p=>p[1]))]);
 for(let i=0;i<its.length;i++){const b=bb[i],sd=[];if(b[0]<-1)sd.push('west');if(b[1]>R.w+1)sd.push('east');if(b[2]<-1)sd.push('north');if(b[3]>R.l+1)sd.push('south');if(sd.length){out.push({it:its[i],sd});bad.add(its[i].id)}
  if(shape(its[i])==='rug')continue;
  for(let j=i+1;j<its.length;j++){if(shape(its[j])==='rug')continue;const c=bb[j];if(b[1]<c[0]||c[1]<b[0]||b[3]<c[2]||c[3]<b[2])continue;if(sat(cs[i],cs[j])){ov.push([its[i],its[j]]);bad.add(its[i].id);bad.add(its[j].id)}}}
 for(const o of P.ops){if(o.type==='win')continue;const z=zone(o);its.forEach((it,i)=>{if(shape(it)!=='rug'&&sat(cs[i],z)){cl.push({o,it});bad.add(it.id);badO.add(o.id)}})}
 return{ov,out,cl,bad,badO}}
// ---------- drawing ----------
const rr=(c,x,y,w,h,r)=>{r=Math.min(r,Math.abs(w)/2,Math.abs(h)/2);c.beginPath();c.roundRect?c.roundRect(x,y,w,h,r):c.rect(x,y,w,h)};
function mix(h,t){const n=parseInt(h.slice(1),16),r=n>>16,g=n>>8&255,b=n&255,f=t<0?0:255,a=Math.abs(t),m=v=>Math.round(v+(f-v)*a);return`rgb(${m(r)},${m(g)},${m(b)})`}

 switch(s){
 case'sofa':{R(x0,y0,w,h,m*.14,col);R(x0,y0,w,h*.26,m*.1,mix(col,-.12));const n=Math.max(1,Math.round(w/(h*.8))),mg=w*.04,cw=(w-2*mg)/n;for(let i=0;i<n;i++)R(x0+mg+i*cw+lw,y0+h*.3,cw-2*lw,h*.66,m*.08,mix(col,.28));break}
 case'bed':{R(x0,y0,w,h,m*.05,mix(col,-.12));R(x0+w*.04,y0+h*.06,w*.92,h*.9,m*.04,mix(col,.55));const n=w>1100?2:1,pw=w*.86/n;for(let i=0;i<n;i++)R(x0+w*.07+i*pw+w*.01,y0+h*.09,pw-w*.02,h*.13,m*.04,'#fffaf5');R(x0+w*.04,y0+h*.32,w*.92,h*.64,m*.04,mix(col,.1));break}
 case'table':R(x0,y0,w,h,m*.06,col);R(x0+m*.08,y0+m*.08,w-m*.16,h-m*.16,m*.04,mix(col,.25));break;
 case'rtable':E(0,0,w/2,h/2,col);E(0,0,w*.4,h*.4,mix(col,.25));break;
 case'chair':R(x0+w*.08,y0+h*.22,w*.84,h*.72,m*.15,col);R(x0+w*.08,y0,w*.84,h*.2,m*.08,mix(col,-.22));break;
